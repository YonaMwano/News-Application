<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NewsPulse – Real-time news aggregator powered by Currents API. Clean, modern 2026 design." />
  <title>{% block title %}NewsPulse{% endblock %} · Real-time News</title>

  <!-- Fonts: Inter + Instrument Serif for editorial feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN (Play CDN for rapid prototyping) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Instrument Serif', 'Georgia', 'serif'],
          },
          colors: {
            ink: {
              50: '#f7f7f8',
              100: '#eeeef0',
              200: '#d9d9de',
              300: '#b8b8c1',
              400: '#91919f',
              500: '#737384',
              600: '#5d5d6b',
              700: '#4c4c57',
              800: '#41414a',
              900: '#393940',
              950: '#18181b',
            },
            accent: {
              DEFAULT: '#e11d48',
              hover: '#be123c',
              soft: '#fff1f2',
            }
          },
          boxShadow: {
            'card': '0 1px 3px 0 rgb(0 0 0 / 0.04), 0 1px 2px -1px rgb(0 0 0 / 0.04)',
            'card-hover': '0 10px 25px -5px rgb(0 0 0 / 0.08), 0 8px 10px -6px rgb(0 0 0 / 0.04)',
          }
        }
      }
    }
  </script>

  <style>
    /* Smooth theme transition */
    html { transition: background-color 0.2s ease, color 0.2s ease; }
    body { font-feature-settings: "ss01", "ss02", "cv01"; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #a1a1aa; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #52525b; }

    /* Card image aspect + fallback */
    .news-img {
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: linear-gradient(135deg, #27272a 0%, #18181b 100%);
    }

    /* Subtle entrance */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeUp 0.45s ease-out both;
    }

    /* Sticky header blur */
    .header-blur {
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
    }
  </style>

  {% block head %}{% endblock %}
</head>
<body class="h-full bg-zinc-50 text-zinc-900 dark:bg-ink-950 dark:text-zinc-100 antialiased">

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="sticky top-0 z-50 header-blur bg-white/80 dark:bg-ink-950/80 border-b border-zinc-200/80 dark:border-zinc-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">

        <!-- Logo -->
        <a href="{{ url_for('index') }}" class="flex items-center gap-2.5 group shrink-0">
          <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
            </svg>
          </div>
          <span class="font-serif text-2xl tracking-tight text-zinc-900 dark:text-white">
            News<span class="text-accent">Pulse</span>
          </span>
        </a>

        <!-- Search (desktop) -->
        <form action="{{ url_for('index') }}" method="get" class="hidden md:flex flex-1 max-w-xl mx-6">
          <div class="relative w-full">
            <input
              type="search"
              name="q"
              value="{{ query or '' }}"
              placeholder="Search topics, companies, people…"
              class="w-full pl-10 pr-4 py-2.5 rounded-full bg-zinc-100 dark:bg-zinc-900 border border-transparent focus:border-accent/40 focus:ring-2 focus:ring-accent/20 outline-none text-sm transition-all placeholder:text-zinc-400 dark:placeholder:text-zinc-500"
              autocomplete="off"
            />
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
        </form>

        <!-- Actions -->
        <div class="flex items-center gap-2">
          <!-- Dark mode toggle -->
          <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
                  class="p-2.5 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors text-zinc-500 dark:text-zinc-400">
            <svg id="icon-sun" class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="icon-moon" class="w-5 h-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>

          <!-- Mobile search toggle -->
          <button id="mobile-search-btn" type="button" class="md:hidden p-2.5 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile search bar (hidden by default) -->
      <div id="mobile-search" class="hidden md:hidden pb-3">
        <form action="{{ url_for('index') }}" method="get">
          <input
            type="search"
            name="q"
            value="{{ query or '' }}"
            placeholder="Search news…"
            class="w-full px-4 py-2.5 rounded-xl bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-sm outline-none focus:ring-2 focus:ring-accent/30"
          />
        </form>
      </div>
    </div>

    <!-- Category nav -->
    <nav class="border-t border-zinc-100 dark:border-zinc-900/60">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex gap-1 overflow-x-auto py-2 scrollbar-hide -mx-1">
          {% for cat_id, cat_name in categories %}
          <a href="{{ url_for('index', category=cat_id) }}"
             class="shrink-0 px-3.5 py-1.5 rounded-full text-sm font-medium transition-all
                    {% if active_category == cat_id and not query %}
                      bg-accent text-white shadow-sm
                    {% else %}
                      text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 hover:text-zinc-900 dark:hover:text-white
                    {% endif %}">
            {{ cat_name }}
          </a>
          {% endfor %}
        </div>
      </div>
    </nav>
  </header>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <main class="min-h-[calc(100vh-8rem)]">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ───────────────────────────────────────────────────────────── -->
  <footer class="border-t border-zinc-200 dark:border-zinc-800/80 mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <span class="font-serif text-lg">News<span class="text-accent">Pulse</span></span>
          <span class="text-zinc-400 text-sm">· Real-time news for 2026</span>
        </div>
        <p class="text-sm text-zinc-500 dark:text-zinc-400 text-center sm:text-right">
          Powered by <a href="https://currentsapi.services" target="_blank" rel="noopener" class="underline hover:text-accent">Currents API</a>
          · Built with Flask & Tailwind
        </p>
      
  </footer>

  <script>
    // Theme toggle with localStorage
    const html = document.documentElement;
    const toggle = document.getElementById('theme-toggle');

    // Init from storage or system preference
    const stored = localStorage.getItem('theme');
    if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
    } else {
      html.classList.remove('dark');
    }

    toggle?.addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });

    // Mobile search
    document.getElementById('mobile-search-btn')?.addEventListener('click', () => {
      document.getElementById('mobile-search')?.classList.toggle('hidden');
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
